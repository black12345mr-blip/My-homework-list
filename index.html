<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐼 แพนด้าตามงาน x Academic Quest</title>

  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .task-card { transition: all 0.2s ease-in-out; }
    .task-card:hover { transform: translateY(-2px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-3xl">🐼</span>
        <div>
          <h1 class="text-xl font-bold leading-tight">แพนด้าตามงาน</h1>
          <p class="text-xs text-emerald-100">ระบบบันทึกการบ้าน & ส่ง Gmail แจ้งเตือนอัตโนมัติ</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 mt-6">

    <!-- Form Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
      <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
        <span>📝</span> เพิ่มรายการการบ้านใหม่
      </h2>
      
      <form id="taskForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">หมวดหมู่วิชา</label>
            <input type="text" id="subjectInput" required placeholder="เช่น คณิตศาสตร์, ภาษาไทย" 
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">ชื่องาน / รายละเอียดการบ้าน</label>
            <input type="text" id="titleInput" required placeholder="เช่น แบบฝึกหัดบทที่ 3 หน้า 45" 
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">กำหนดส่ง (Due Date)</label>
            <input type="date" id="dueDateInput" required 
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">อีเมลผู้รับการแจ้งเตือน (Gmail)</label>
            <input type="email" id="emailInput" required placeholder="your-email@gmail.com" 
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
          </div>
        </div>

        <button type="submit" id="submitBtn" 
          class="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-6 rounded-xl shadow-md hover:shadow-lg transition flex justify-center items-center gap-2 cursor-pointer">
          <span>🐼</span> บันทึกการบ้าน & ส่งเข้า Gmail
        </button>
      </form>
    </section>

    <!-- Task List Section -->
    <section>
      <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
        <span>📋</span> รายการการบ้านทั้งหมด
      </h2>
      <div id="taskList" class="space-y-3">
        <!-- รายการการบ้านจะถูกเพิ่มมาตรงนี้ -->
      </div>
    </section>

  </main>

  <!-- Script เชื่อมต่อ Google Apps Script -->
  <script>
    // URL ของ Web App ล่าสุดตามที่คุณระบุ
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx0ytiQCKtH-XrwuXNPCTWAykRC_D5_fv7r3ifawSK0aiD0zgymJGKG4In9MK6x5G8m/exec";

    const taskForm = document.getElementById('taskForm');
    const submitBtn = document.getElementById('submitBtn');
    const taskList = document.getElementById('taskList');

    let tasks = JSON.parse(localStorage.getItem('panda_tasks')) || [];

    // แสดงรายการการบ้านเมื่อโหลดหน้า
    renderTasks();

    // เมื่อกดปุ่มส่งฟอร์ม
    taskForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const taskData = {
        subject: document.getElementById('subjectInput').value,
        taskTitle: document.getElementById('titleInput').value,
        dueDate: document.getElementById('dueDateInput').value,
        userEmail: document.getElementById('emailInput').value
      };

      // เปลี่ยนปุ่มเป็นสถานะกำลังส่งข้อมูล
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>⏳</span> กำลังบันทึกข้อมูลและส่ง Gmail...`;

      try {
        // ส่งข้อมูลเข้า Google Apps Script
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(taskData)
        });

        // บันทึกลง LocalStorage หน้าเว็บ
        tasks.push(taskData);
        localStorage.setItem('panda_tasks', JSON.stringify(tasks));
        renderTasks();

        alert('🐼 บันทึกการบ้านสำเร็จ! ระบบกำลังส่ง Gmail แจ้งเตือนไปยังอีเมลของคุณ');
        taskForm.reset();

      } catch (error) {
        console.error('Error:', error);
        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>🐼</span> บันทึกการบ้าน & ส่งเข้า Gmail`;
      }
    });

    // ฟังก์ชันวาดรายการการบ้านบนหน้าเว็บ
    function renderTasks() {
      if (tasks.length === 0) {
        taskList.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 border border-slate-200">ยังไม่มีรายการการบ้าน เพิ่มงานแรกของคุณได้เลย!</div>`;
        return;
      }

      taskList.innerHTML = tasks.map((task, index) => `
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center task-card">
          <div>
            <span class="inline-block bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-medium mb-1">${task.subject}</span>
            <h3 class="font-bold text-slate-800 text-base">${task.taskTitle}</h3>
            <p class="text-xs text-slate-500 mt-1">กำหนดส่ง: <span class="text-rose-600 font-semibold">${task.dueDate}</span> | ส่งแจ้งเตือนไปที่: ${task.userEmail}</p>
          </div>
          <button onclick="deleteTask(${index})" class="text-slate-400 hover:text-rose-500 p-2 transition cursor-pointer" title="ลบรายการ">
            🗑️
          </button>
        </div>
      `).join('');
    }

    // ฟังก์ชันลบการบ้าน
    function deleteTask(index) {
      if (confirm('ต้องการลบรายการการบ้านนี้ใช่หรือไม่?')) {
        tasks.splice(index, 1);
        localStorage.setItem('panda_tasks', JSON.stringify(tasks));
        renderTasks();
      }
    }
  </script>
</body>
</html>
