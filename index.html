<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเคลียร์การบ้าน ม.ปลาย (Pro Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .task-card { transition: all 0.2s ease-in-out; }
        .task-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-12 transition-colors duration-300">

    <div class="absolute inset-0 -z-10 h-72 bg-gradient-to-br from-purple-600 to-indigo-600 opacity-90 rounded-b-[2.5rem]"></div>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 flex justify-between items-center text-white">
            <div>
                <span class="bg-white/15 backdrop-blur-md text-xs font-medium px-3.5 py-1.5 rounded-full border border-white/25">📚 Student Productivity Hub</span>
                <h1 class="text-2xl md:text-3xl font-bold mt-3">ระบบเคลียร์การบ้าน ม.ปลาย</h1>
            </div>
            <button onclick="toggleDarkMode()" class="bg-white/20 hover:bg-white/30 backdrop-blur-md p-2.5 rounded-2xl border border-white/30 text-sm transition">
                🌙 / ☀️
            </button>
        </header>

        <section class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-white/50 dark:border-slate-800 p-5 rounded-3xl shadow-xl mb-8">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">📊 ความคืบหน้าการเคลียร์การบ้านทั้งหมด</span>
                <span id="progressText" class="text-xs font-bold text-purple-600 dark:text-purple-400">0%</span>
            </div>
            <div class="w-full bg-slate-100 dark:bg-slate-800 h-3 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-purple-500 to-indigo-600 h-full w-0 transition-all duration-500"></div>
            </div>
        </section>

        <section class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-white/50 dark:border-slate-800 p-6 rounded-3xl shadow-xl mb-8">
            <h2 class="text-base font-semibold text-slate-800 dark:text-slate-200 mb-4 flex items-center gap-2">
                <span>📝</span> เพิ่มการบ้าน / งานใหม่
            </h2>

            <form id="taskForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">ชื่องาน / การบ้าน *</label>
                    <input type="text" id="taskTitle" placeholder="เช่น ทำรายงานชีวะ, แบบฝึกหัดคณิต..." required
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white">
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">วิชา / หมวดหมู่</label>
                    <select id="taskCategory" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white">
                        <option value="📐 คณิตศาสตร์">📐 คณิตศาสตร์</option>
                        <option value="🧪 วิทยาศาสตร์">🧪 วิทยาศาสตร์</option>
                        <option value="📖 ภาษาไทย">📖 ภาษาไทย</option>
                        <option value="🌍 สังคมศึกษา">🌍 สังคมศึกษา</option>
                        <option value="💬 ภาษาอังกฤษ">💬 ภาษาอังกฤษ</option>
                        <option value="💻 คอมพิวเตอร์/อื่นๆ">💻 คอมพิวเตอร์/อื่นๆ</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">กำหนดส่ง *</label>
                    <input type="date" id="taskDate" required
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">ความเร่งด่วน</label>
                    <select id="taskPriority" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white">
                        <option value="ปกติ">🟢 ปกติ (ส่งทัน)</option>
                        <option value="ด่วน">⚡ รีบทำ (พรุ่งนี้)</option>
                        <option value="ด่วนที่สุด">🔥 ด่วนสุดๆ (ส่งวันนี้!)</option>
                    </select>
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">แนบลิงก์ (เช่น Canva, Google Drive)</label>
                    <input type="url" id="taskLink" placeholder="https://..." 
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white">
                </div>

                <div class="flex items-end">
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-xl px-4 py-2.5 text-sm shadow-md shadow-purple-600/25 transition">
                        + บันทึกการบ้าน
                    </button>
                </div>
            </form>
        </section>

        <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 mb-6">
            <input type="text" id="searchInput" placeholder="🔍 ค้นหาชื่อการบ้านหรือวิชา..." oninput="renderTasks()"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 dark:text-white">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-100/80 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl flex flex-col">
                <div class="flex justify-between items-center mb-4 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        <h3 class="font-semibold text-slate-700 dark:text-slate-300 text-sm">ยังไม่ได้ทำ (To Do)</h3>
                    </div>
                    <span id="todoCount" class="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold text-xs px-2.5 py-1 rounded-full shadow-xs">0</span>
                </div>
                <div id="todoList" class="space-y-4 flex-1 min-h-[250px]"></div>
            </div>

            <div class="bg-slate-100/80 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl flex flex-col">
                <div class="flex justify-between items-center mb-4 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
                        <h3 class="font-semibold text-slate-700 dark:text-slate-300 text-sm">กำลังทำ (In Progress)</h3>
                    </div>
                    <span id="inprogressCount" class="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold text-xs px-2.5 py-1 rounded-full shadow-xs">0</span>
                </div>
                <div id="inprogressList" class="space-y-4 flex-1 min-h-[250px]"></div>
            </div>

            <div class="bg-slate-100/80 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl flex flex-col">
                <div class="flex justify-between items-center mb-4 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <h3 class="font-semibold text-slate-700 dark:text-slate-300 text-sm">ส่งแล้ว / เสร็จสิ้น (Done)</h3>
                    </div>
                    <span id="doneCount" class="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold text-xs px-2.5 py-1 rounded-full shadow-xs">0</span>
                </div>
                <div id="doneList" class="space-y-4 flex-1 min-h-[250px]"></div>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('student_homework_pro')) || [];

        // โหลดธีมเดิมที่เคยเลือก
        if(localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            if(document.documentElement.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        }

        const taskForm = document.getElementById('taskForm');
        taskForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newTask = {
                id: Date.now(),
                title: document.getElementById('taskTitle').value,
                category: document.getElementById('taskCategory').value,
                date: document.getElementById('taskDate').value,
                priority: document.getElementById('taskPriority').value,
                link: document.getElementById('taskLink').value,
                subtasks: [],
                status: 'todo'
            };
            tasks.push(newTask);
            saveAndRender();
            taskForm.reset();
        });

        function saveAndRender() {
            localStorage.setItem('student_homework_pro', JSON.stringify(tasks));
            renderTasks();
        }

        function changeStatus(id, newStatus) {
            tasks = tasks.map(task => {
                if (task.id === id) task.status = newStatus;
                return task;
            });
            saveAndRender();
        }

        function deleteTask(id) {
            if(confirm('ต้องการลบการบ้านนี้ใช่ไหม?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveAndRender();
            }
        }

        function addSubtask(taskId) {
            const input = document.getElementById(`sub-input-${taskId}`);
            if(!input.value.trim()) return;
            tasks = tasks.map(task => {
                if(task.id === taskId) {
                    if(!task.subtasks) task.subtasks = [];
                    task.subtasks.push({ id: Date.now(), text: input.value, done: false });
                }
                return task;
            });
            saveAndRender();
        }

        function toggleSubtask(taskId, subId) {
            tasks = tasks.map(task => {
                if(task.id === taskId) {
                    task.subtasks = task.subtasks.map(sub => {
                        if(sub.id === subId) sub.done = !sub.done;
                        return sub;
                    });
                }
                return task;
            });
            saveAndRender();
        }

        function deleteSubtask(taskId, subId) {
            tasks = tasks.map(task => {
                if(task.id === taskId) {
                    task.subtasks = task.subtasks.filter(sub => sub.id !== subId);
                }
                return task;
            });
            saveAndRender();
        }

        function renderTasks() {
            const todoList = document.getElementById('todoList');
            const inprogressList = document.getElementById('inprogressList');
            const doneList = document.getElementById('doneList');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            todoList.innerHTML = '';
            inprogressList.innerHTML = '';
            doneList.innerHTML = '';

            let todoC = 0, inprogressC = 0, doneC = 0;
            const todayStr = new Date().toISOString().split('T')[0];

            tasks.forEach(task => {
                if(searchQuery && !task.title.toLowerCase().includes(searchQuery) && !task.category.toLowerCase().includes(searchQuery)) return;

                let priorityBadge = 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300';
                if (task.priority === 'ด่วน') priorityBadge = 'bg-amber-50 text-amber-600 border border-amber-200 dark:bg-amber-950/40 dark:text-amber-400 dark:border-amber-900';
                if (task.priority === 'ด่วนที่สุด') priorityBadge = 'bg-rose-50 text-rose-600 border border-rose-200 dark:bg-rose-950/40 dark:text-rose-400 dark:border-rose-900';

                let isOverdue = task.date < todayStr && task.status !== 'done';
                let dateBadgeClass = isOverdue ? 'text-rose-600 font-bold bg-rose-50 dark:bg-rose-950/50 px-2 py-0.5 rounded' : 'text-slate-400 dark:text-slate-500';

                let subHtml = '';
                if(task.subtasks && task.subtasks.length > 0) {
                    subHtml = `<div class="space-y-1.5 my-3 bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">`;
                    task.subtasks.forEach(sub => {
                        subHtml += `
                            <div class="flex items-center justify-between text-xs">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" ${sub.done ? 'checked' : ''} onchange="toggleSubtask(${task.id}, ${sub.id})" class="rounded text-purple-600 focus:ring-purple-500">
                                    <span class="${sub.done ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-300'}">${sub.text}</span>
                                </label>
                                <button onclick="deleteSubtask(${task.id}, ${sub.id})" class="text-slate-300 hover:text-rose-500">×</button>
                            </div>
                        `;
                    });
                    subHtml += `</div>`;
                }

                const card = document.createElement('div');
                card.className = "task-card bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 p-4 rounded-2xl shadow-xs flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="font-medium text-slate-800 dark:text-slate-200 text-sm leading-snug">${task.title}</span>
                            <span class="text-[11px] font-medium px-2 py-0.5 rounded-full shrink-0 ${priorityBadge}">${task.priority}</span>
                        </div>
                        <div class="mb-2">
                            <span class="bg-purple-50 dark:bg-purple-950/50 text-purple-600 dark:text-purple-400 text-[11px] font-medium px-2 py-0.5 rounded">${task.category}</span>
                        </div>
                        ${task.link ? `<a href="${task.link}" target="_blank" class="text-xs text-purple-600 dark:text-purple-400 hover:underline flex items-center gap-1 mb-2 font-medium">🔗 เปิดลิงก์งาน/สไลด์</a>` : ''}
                        
                        ${subHtml}
                        <div class="flex gap-2 mb-3">
                            <input type="text" id="sub-input-${task.id}" placeholder="+ เพิ่มข้อย่อย..." class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-purple-500 dark:text-white">
                            <button onclick="addSubtask(${task.id})" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs px-2.5 py-1 rounded-lg font-medium shrink-0">เพิ่ม</button>
                        </div>

                        <div class="text-[11px] mb-3 ${dateBadgeClass}">
                            📅 กำหนดส่ง: ${task.date} ${isOverdue ? '⚠️ (เลยกำหนดส่งแล้ว!)' : ''}
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-slate-100 dark:border-slate-800 text-xs">
                        <div class="flex items-center gap-1.5">
                            ${task.status !== 'todo' ? `<button onclick="changeStatus(${task.id}, 'todo')" class="text-slate-400 hover:text-purple-600 transition">⬅️ ยังไม่ทำ</button>` : ''}
                            ${task.status !== 'inprogress' && task.status !== 'done' ? `<button onclick="changeStatus(${task.id}, 'inprogress')" class="text-purple-600 hover:text-purple-400 font-medium transition">กำลังทำ ⚡</button>` : ''}
                            ${task.status !== 'done' ? `<button onclick="changeStatus(${task.id}, 'done')" class="text-emerald-600 hover:text-emerald-400 font-medium transition">เสร็จ ✅</button>` : ''}
                        </div>
                        <button onclick="deleteTask(${task.id})" class="text-slate-300 hover:text-rose-500 transition text-[11px]">ลบ</button>
                    </div>
                `;

                if (task.status === 'todo') {
                    todoList.appendChild(card);
                    todoC++;
                } else if (task.status === 'inprogress') {
                    inprogressList.appendChild(card);
                    inprogressC++;
                } else if (task.status === 'done') {
                    doneList.appendChild(card);
                    doneC++;
                }
            });

            document.getElementById('todoCount').innerText = todoC;
            document.getElementById('inprogressCount').innerText = inprogressC;
            document.getElementById('doneCount').innerText = doneC;

            // คำนวณเปอร์เซ็นต์ Progress Bar
            const totalTasks = tasks.length;
            const percent = totalTasks === 0 ? 0 : Math.round((doneC / totalTasks) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText.innerText', percent + '%');
            document.getElementById('progressText').innerText = percent + '% เสร็จสิ้น';
        }

        renderTasks();
    </script>
</body>
</html>
