<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งงานหัวหน้าทีม & ส่ง LINE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .task-card { transition: all 0.2s ease-in-out; }
        .task-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen pb-12 transition-colors duration-300">

    <div class="absolute inset-0 -z-10 h-72 bg-gradient-to-br from-blue-600 to-indigo-700 opacity-90 rounded-b-[2.5rem]"></div>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 flex justify-between items-center text-white">
            <div>
                <span class="bg-white/15 backdrop-blur-md text-xs font-medium px-3.5 py-1.5 rounded-full border border-white/25">👔 Leader Command Center</span>
                <h1 class="text-2xl md:text-3xl font-bold mt-3">ระบบบันทึกงานหัวหน้า & สรุปส่ง LINE</h1>
            </div>
            <button onclick="toggleDarkMode()" class="bg-white/20 hover:bg-white/30 backdrop-blur-md p-2.5 rounded-2xl border border-white/30 text-sm transition">
                🌙 / ☀️
            </button>
        </header>

        <section class="bg-emerald-600 dark:bg-emerald-900 text-white p-5 rounded-3xl shadow-lg mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="font-bold text-lg flex items-center gap-2">📱 สรุปงานประจำวันสำหรับส่ง LINE ทีม</h2>
                <p class="text-emerald-100 text-xs mt-1">กดปุ่มด้านข้างเพื่อคัดลอกข้อความสรุปงานทั้งหมดในบอร์ดไปวางในแชท LINE ได้ทันที</p>
            </div>
            <button onclick="copyLineReport()" class="bg-white text-emerald-700 hover:bg-emerald-50 font-bold px-5 py-3 rounded-2xl text-sm shadow-md transition shrink-0 active:scale-95">
                📋 คัดลอกข้อความส่ง LINE
            </button>
        </section>

        <section class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-white/50 dark:border-slate-800 p-6 rounded-3xl shadow-xl mb-8">
            <h2 class="text-base font-semibold text-slate-800 dark:text-slate-200 mb-4 flex items-center gap-2">
                <span>📌</span> สั่งงาน / บันทึกภารกิจวันนี้
            </h2>

            <form id="taskForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">หัวข้องาน / คำสั่ง *</label>
                    <input type="text" id="taskTitle" placeholder="เช่น ตรวจสอบงบประมาณโปรเจกต์ A..." required
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">ผู้รับผิดชอบ / ทีม</label>
                    <input type="text" id="taskAssignee" placeholder="เช่น ทีมบัญชี / คุณสมชาย..." required
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">กำหนดส่ง *</label>
                    <input type="date" id="taskDate" required
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">ความเร่งด่วน</label>
                    <select id="taskPriority" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
                        <option value="ปกติ">🟢 ปกติ</option>
                        <option value="ด่วน">⚡ ด่วน</option>
                        <option value="ด่วนที่สุด">🔥 ด่วนที่สุด (เคลียร์วันนี้)</option>
                    </select>
                </div>

                <div class="md:col-span-3">
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">รายละเอียด / ลิงก์เอกสารอ้างอิง</label>
                    <input type="text" id="taskDesc" placeholder="ลิงก์ Drive หรือรายละเอียดเพิ่มเติม..." 
                        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
                </div>

                <div class="flex items-end">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl px-4 py-2.5 text-sm shadow-md shadow-blue-600/25 transition">
                        + บันทึกคำสั่งงาน
                    </button>
                </div>
            </form>
        </section>

        <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 mb-6">
            <input type="text" id="searchInput" placeholder="🔍 ค้นหางาน หรือชื่อผู้รับผิดชอบ..." oninput="renderTasks()"
                class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-100/80 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl flex flex-col">
                <div class="flex justify-between items-center mb-4 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        <h3 class="font-semibold text-slate-700 dark:text-slate-300 text-sm">รอดำเนินการ (To Do)</h3>
                    </div>
                    <span id="todoCount" class="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold text-xs px-2.5 py-1 rounded-full shadow-xs">0</span>
                </div>
                <div id="todoList" class="space-y-4 flex-1 min-h-[250px]"></div>
            </div>

            <div class="bg-slate-100/80 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl flex flex-col">
                <div class="flex justify-between items-center mb-4 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
                        <h3 class="font-semibold text-slate-700 dark:text-slate-300 text-sm">กำลังดำเนินการ (In Progress)</h3>
                    </div>
                    <span id="inprogressCount" class="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold text-xs px-2.5 py-1 rounded-full shadow-xs">0</span>
                </div>
                <div id="inprogressList" class="space-y-4 flex-1 min-h-[250px]"></div>
            </div>

            <div class="bg-slate-100/80 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-5 rounded-3xl flex flex-col">
                <div class="flex justify-between items-center mb-4 px-1">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <h3 class="font-semibold text-slate-700 dark:text-slate-300 text-sm">เสร็จสิ้น (Done)</h3>
                    </div>
                    <span id="doneCount" class="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold text-xs px-2.5 py-1 rounded-full shadow-xs">0</span>
                </div>
                <div id="doneList" class="space-y-4 flex-1 min-h-[250px]"></div>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('leader_tasks')) || [];

        if(localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        const taskForm = document.getElementById('taskForm');
        taskForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const newTask = {
                id: Date.now(),
                title: document.getElementById('taskTitle').value,
                assignee: document.getElementById('taskAssignee').value,
                date: document.getElementById('taskDate').value,
                priority: document.getElementById('taskPriority').value,
                desc: document.getElementById('taskDesc').value,
                status: 'todo'
            };
            tasks.push(newTask);
            saveAndRender();
            taskForm.reset();
        });

        function saveAndRender() {
            localStorage.setItem('leader_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function changeStatus(id, newStatus) {
            tasks = tasks.map(task => {
                if (task.id === id) task.status = newStatus;
                return task;
            });
            saveAndRender();
        }

        function deleteTask(id) {
            if(confirm('ต้องการลบงานนี้ใช่ไหม?')) {
                tasks = tasks.filter(task => task.id !== id);
                saveAndRender();
            }
        }

        // ฟังก์ชันจัดรูปแบบข้อความเพื่อคัดลอกส่ง LINE
        function copyLineReport() {
            if (tasks.length === 0) {
                alert('ยังไม่มีรายการงานในระบบครับ');
                return;
            }

            let report = "📋 สรุปงานประจำวัน / สั่งการ (Leader Report)\n";
            report += "📅 วันที่: " + new Date().toLocaleDateString('th-TH') + "\n";
            report += "-----------------------------------\n\n";

            // จัดหมวดหมู่ในข้อความไลน์
            const todoItems = tasks.filter(t => t.status === 'todo');
            const inprogressItems = tasks.filter(t => t.status === 'inprogress');
            const doneItems = tasks.filter(t => t.status === 'done');

            if (todoItems.length > 0) {
                report += "📌 รอดำเนินการ (To Do):\n";
                todoItems.forEach((t, i) => {
                    report += `${i + 1}. ${t.title} [ผู้รับผิดชอบ: ${t.assignee}] (กำหนด: ${t.date}) ${t.priority === 'ด่วนที่สุด' ? '🔥' : ''}\n`;
                });
                report += "\n";
            }

            if (inprogressItems.length > 0) {
                report += "⚡ กำลังดำเนินการ (In Progress):\n";
                inprogressItems.forEach((t, i) => {
                    report += `${i + 1}. ${t.title} [ผู้รับผิดชอบ: ${t.assignee}]\n`;
                });
                report += "\n";
            }

            if (doneItems.length > 0) {
                report += "✅ เสร็จสิ้น (Done):\n";
                doneItems.forEach((t, i) => {
                    report += `${i + 1}. ${t.title} [ผู้รับผิดชอบ: ${t.assignee}]\n`;
                });
            }

            // คัดลอกลงคลิปบอร์ด
            navigator.clipboard.writeText(report).then(() => {
                alert('คัดลอกสรุปงานสำหรับส่ง LINE เรียบร้อยแล้ว! สามารถนำไปกด Paste ในแชท LINE ได้ทันทีครับ');
            }).catch(err => {
                alert('เกิดข้อผิดพลาดในการคัดลอก');
            });
        }

        function renderTasks() {
            const todoList = document.getElementById('todoList');
            const inprogressList = document.getElementById('inprogressList');
            const doneList = document.getElementById('doneList');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            todoList.innerHTML = '';
            inprogressList.innerHTML = '';
            doneList.innerHTML = '';

            let todoC = 0, inprogressC = 0, doneC = 0;
            const todayStr = new Date().toISOString().split('T')[0];

            const filteredTasks = tasks.filter(task => {
                if (!searchQuery) return true;
                return task.title.toLowerCase().includes(searchQuery) || task.assignee.toLowerCase().includes(searchQuery);
            });

            filteredTasks.forEach(task => {
                let priorityBadge = 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300';
                if (task.priority === 'ด่วน') priorityBadge = 'bg-amber-50 text-amber-600 border border-amber-200 dark:bg-amber-950/40 dark:text-amber-400 dark:border-amber-900';
                if (task.priority === 'ด่วนที่สุด') priorityBadge = 'bg-rose-50 text-rose-600 border border-rose-200 dark:bg-rose-950/40 dark:text-rose-400 dark:border-rose-900';

                let isOverdue = task.date < todayStr && task.status !== 'done';
                let dateBadgeClass = isOverdue ? 'text-rose-600 font-bold bg-rose-50 dark:bg-rose-950/50 px-2 py-0.5 rounded' : 'text-slate-400 dark:text-slate-500';

                const card = document.createElement('div');
                card.className = "task-card bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 p-4 rounded-2xl shadow-xs flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="font-medium text-slate-800 dark:text-slate-200 text-sm leading-snug">${task.title}</span>
                            <span class="text-[11px] font-medium px-2 py-0.5 rounded-full shrink-0 ${priorityBadge}">${task.priority}</span>
                        </div>
                        <div class="mb-2 flex items-center gap-2">
                            <span class="bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 text-[11px] font-medium px-2 py-0.5 rounded">👤 ${task.assignee}</span>
                        </div>
                        ${task.desc ? `<p class="text-xs text-slate-500 dark:text-slate-400 mb-2 bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg">${task.desc}</p>` : ''}
                        
                        <div class="text-[11px] mb-3 ${dateBadgeClass}">
                            📅 กำหนดส่ง: ${task.date} ${isOverdue ? '⚠️ (เกินกำหนด)' : ''}
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-slate-100 dark:border-slate-800 text-xs">
                        <div class="flex items-center gap-1.5">
                            ${task.status !== 'todo' ? `<button onclick="changeStatus(${task.id}, 'todo')" class="text-slate-400 hover:text-blue-600 transition">⬅️ รอดำเนินการ</button>` : ''}
                            ${task.status !== 'inprogress' && task.status !== 'done' ? `<button onclick="changeStatus(${task.id}, 'inprogress')" class="text-blue-600 dark:text-blue-400 font-medium transition">กำลังทำ ⚡</button>` : ''}
                            ${task.status !== 'done' ? `<button onclick="changeStatus(${task.id}, 'done')" class="text-emerald-600 dark:text-emerald-400 font-medium transition">เสร็จ ✅</button>` : ''}
                        </div>
                        <button onclick="deleteTask(${task.id})" class="text-slate-300 hover:text-rose-500 transition text-[11px]">ลบ</button>
                    </div>
                `;

                if (task.status === 'todo') {
                    todoList.appendChild(card);
                    todoC++;
                } else if (task.status === 'inprogress') {
                    inprogressList.appendChild(card);
                    inprogressC++;
                } else if (task.status === 'done') {
                    doneList.appendChild(card);
                    doneC++;
                }
            });

            document.getElementById('todoCount').innerText = todoC;
            document.getElementById('inprogressCount').innerText = inprogressC;
            document.getElementById('doneCount').innerText = doneC;
        }

        renderTasks();
    </script>
</body>
</html>
